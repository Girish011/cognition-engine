[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cognition-engine"
version = "0.1.0"
description = "A study of mid-execution correction for local LLM agents: CHI health monitoring, activation steering, and context compaction on MLX"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Cognition Engine" }]
keywords = ["llm", "mlx", "cognitive-health", "chi", "monitoring"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "numpy",
    # MLX only ships wheels for Apple Silicon macOS; elsewhere the pure-Python
    # parts (parser, memory, sessions, steering-vector math) still import.
    "mlx; sys_platform == 'darwin'",
    "mlx-lm; sys_platform == 'darwin'",
]

[project.scripts]
cognition-engine = "cognition_engine.cli:main"

[project.optional-dependencies]
dev = [
    "matplotlib",
    "pytest",
]


[tool.setuptools.packages.find]
where = ["."]
include = ["cognition_engine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
